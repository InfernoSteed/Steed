version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: sacred_empire_db
    environment:
      POSTGRES_DB: sacred_empire
      POSTGRES_USER: sacred_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sacred_user -d sacred_empire"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: sacred_empire_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sacred_empire_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://sacred_user:${DB_PASSWORD:-changeme123}@db:5432/sacred_empire
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALLOWED_HOSTS=localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker (Background Tasks)
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sacred_empire_celery
    command: celery -A sacred_empire worker -l info
    volumes:
      - ./backend:/app/backend
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://sacred_user:${DB_PASSWORD:-changeme123}@db:5432/sacred_empire
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat (Scheduled Tasks)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sacred_empire_celery_beat
    command: celery -A sacred_empire beat -l info
    volumes:
      - ./backend:/app/backend
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://sacred_user:${DB_PASSWORD:-changeme123}@db:5432/sacred_empire
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
