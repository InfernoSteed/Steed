<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GLDnSteed Studios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* GLDnSteed Studios Color Palette */

      /* Studio OS Design System */

      /* Surfaces (Deep OLED Stack) */
      --theme-bg: #09090b;
      /* Surface 0: Main App Background (Deepest) */
      --theme-panel: #18181b;
      /* Surface 1: Panels, Sidebar */
      --theme-surface: #27272a;
      /* Surface 2: Headers, Inputs */
      --theme-hover: #3f3f46;
      /* Surface 3: Hover States */

      /* Borders & Separators */
      --theme-border: #27272a;
      /* Subtle separation */
      --theme-border-highlight: #52525b;
      /* Lighter border */

      /* Accents */
      --theme-accent: #ffdc73;
      /* Gold - Primary Action */
      --theme-accent-dim: rgba(255, 220, 115, 0.1);
      /* Gold Background */
      --theme-accent-hover: #e6c668;
      /* Darker Gold */

      /* Text */
      --theme-text: #e4e4e7;
      /* Zinc-200 - Primary Text */
      --theme-text-muted: #a1a1aa;
      /* Zinc-400 - Secondary Text */
      --theme-text-dim: #71717a;
      /* Zinc-500 - Tertiary Text */

      /* Status */
      --theme-danger: #ef4444;
      /* Red-500 */
      --theme-success: #10b981;
      /* Emerald-500 */
      --theme-warning: #f59e0b;
      /* Amber-500 */
      --theme-info: #3b82f6;
      /* Blue-500 */

      /* Typography */
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: 'Fira Code', 'Courier New', monospace;

      --ease-pro: cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: var(--font-primary);
      background-color: var(--theme-bg);
      color: var(--theme-text);
      line-height: 1.5;
      overflow: hidden;
      /* App-like feel */
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      /* Improved legibility on dark bg */
    }

    /* Accessibility: Focus Styles */
    :focus-visible {
      outline: 2px solid var(--theme-accent);
      outline-offset: 2px;
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {

      *,
      ::before,
      ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Polish: Noise Texture */
    .noise-texture {
      position: relative;
    }

    .noise-texture::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.02;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      z-index: 0;
    }

    .noise-texture>* {
      position: relative;
      z-index: 1;
    }

    /* Studio OS Utilities */

    /* Studio Grid Layout */
    .studio-layout {
      display: grid;
      grid-template-areas:
        "header header header"
        "browser stage inspector"
        "timeline timeline timeline";
      grid-template-columns: 300px 1fr 320px;
      grid-template-rows: 48px 1fr 45vh;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: var(--theme-bg);
    }

    .studio-header {
      grid-area: header;
      z-index: 50;
    }

    .studio-browser {
      grid-area: browser;
      border-right: 1px solid var(--theme-border);
      background: var(--theme-panel);
    }

    .studio-stage {
      grid-area: stage;
      position: relative;
      background: #000;
    }

    .studio-inspector {
      grid-area: inspector;
      border-left: 1px solid var(--theme-border);
      background: var(--theme-panel);
    }

    .studio-timeline {
      grid-area: timeline;
      border-top: 1px solid var(--theme-border);
      background: var(--theme-panel);
      position: relative;
    }

    /* Glassmorphism */
    .glass-panel {
      background: rgba(24, 24, 27, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Typography */
    .text-label {
      font-family: var(--font-primary);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--theme-text-muted);
    }

    .text-mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Fluid Typography */
    .type-responsive {
      font-size: clamp(12px, 1vw, 14px);
    }

    .type-small {
      font-family: var(--font-primary);
      font-size: 12px;
      font-weight: 400;
      color: #6B6B6B;
    }

    .type-timecode {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: #B8B8B8;
    }

    /* Custom Cursors */
    .cursor-grab {
      cursor: grab;
    }

    .cursor-grabbing {
      cursor: grabbing;
    }

    .cursor-scrub {
      cursor: ew-resize;
    }

    .cursor-precision {
      cursor: crosshair;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--theme-bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--theme-surface);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #B8B8B8;
    }

    /* Global Smooth Transitions */
    button,
    a,
    input,
    select,
    .interactive-el {
      transition-property: color, background-color, border-color, transform, opacity, box-shadow;
      transition-timing-function: var(--ease-pro);
      /* Specific durations per property as requested */
      transition-duration: 200ms;
      /* Default fallbacks */
      transition:
        background-color 200ms var(--ease-pro),
        border-color 150ms var(--ease-pro),
        color 200ms var(--ease-pro),
        transform 150ms var(--ease-pro),
        opacity 200ms var(--ease-pro),
        box-shadow 200ms var(--ease-pro),
        width 200ms var(--ease-pro);
    }

    /* Hover state for interactive text */
    a:hover,
    button:hover {
      color: var(--theme-accent);
    }

    /* Utility for height transitions */
    .transition-height {
      transition: grid-template-rows 300ms var(--ease-pro);
    }

    /* Mobile optimizations */
    @media (max-width: 768px) {
      .mobile-touch-target {
        min-height: 48px;
        min-width: 48px;
      }
    }

    /* Animations */
    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .animate-shimmer {
      background: linear-gradient(90deg, #333 25%, #444 50%, #333 75%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite linear;
    }

    @keyframes spin-smooth {
      to {
        transform: rotate(360deg);
      }
    }

    .animate-spin-smooth {
      animation: spin-smooth 1s linear infinite;
    }

    @keyframes pulse-gold {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 220, 115, 0.4);
      }

      50% {
        box-shadow: 0 0 0 10px rgba(255, 220, 115, 0);
      }
    }

    .animate-pulse-gold {
      animation: pulse-gold 2s infinite;
    }

    @keyframes slide-in-right {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .animate-slide-in-right {
      animation: slide-in-right 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes scale-in {
      from {
        transform: scale(0.95);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-scale-in {
      animation: scale-in 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes progress-loading {
      0% {
        width: 0%;
        left: 0;
      }

      50% {
        width: 70%;
        left: 0;
      }

      100% {
        width: 100%;
        left: 0;
      }
    }

    .animate-progress-loading {
      animation: progress-loading 2s ease-in-out forwards;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        screens: {
          'xs': '376px',
          'md': '768px',
          'lg': '1024px',
          'xl': '1440px',
        },
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          },
          colors: {
            theme: {
              bg: 'var(--theme-bg)',
              panel: 'var(--theme-panel)',
              surface: 'var(--theme-surface)',
              border: 'var(--theme-border)',
              accent: 'var(--theme-accent)',
              'accent-hover': 'var(--theme-accent-hover)',
              text: 'var(--theme-text)',
              'text-muted': 'var(--theme-text-muted)',
              'text-highlight': 'var(--theme-text-highlight)',
              danger: 'var(--theme-danger)',
              success: 'var(--theme-success)',
              warning: 'var(--theme-warning)',
              info: 'var(--theme-info)'
            }
          },
          transitionTimingFunction: {
            'pro': 'cubic-bezier(0.4, 0, 0.2, 1)',
          },
          boxShadow: {
            'elevation-1': '0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.15)',
            'elevation-2': '0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.2)',
            'elevation-3': '0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.2)',
            'elevation-4': '0 25px 50px -12px rgba(0, 0, 0, 0.6)',
          }
        }
      }
    }
  </script>

}
